# Phase 3 training config (PPO on OddExitEnv)
# Speed regime: 30–40 km/h (8.3–11.1 m/s) — low-speed urban/sub-urban ODD exit.

run:
  name: "phase3_train"
  seed: 123
  max_steps: 5000

road_network: "curved_20deg"
road_curvature_rad_m: -6.9813170079773183e-04

sim:
  esmini_exe: "esmini/bin/esmini.exe"
  scenario_path: "esmini/bin/resources/xosc/straight_500m.xosc"
  dt: 0.05
  headless: true
  window_size: "60 60 1280 720"
  # City/low-speed deceleration: 4.5 m/s² (was 7.0 for highway).
  # At 40 km/h (11 m/s) + full brake: stop in 2.4 s / 13 m — realistic.
  decel_mps2: 4.5
  state_source: "esmini"
  esmini_lib_show_ui: false   # set false for headless (faster training)
  use_generated_scenario_from_state_bridge: true

udp:
  listen_ip: "127.0.0.1"
  listen_port: 48100
  send_ip: "127.0.0.1"
  send_port: 49950
  recv_timeout_s: 0.5

state_bridge:
  # Ego: 9.0 m/s = 32 km/h at start; throttle 0.1 adds ~1.4 m/s over 7 s → ~37 km/h at ODD exit.
  initial_speed_mps: 9.0
  initial_x_m: 50.0
  initial_y_m: 1.75
  collision_threshold_m: 3.0
  ego_decel_mps2: 4.5   # must match sim.decel_mps2
  actors:
    - actor_id: 1
      x_m: 100.0         # 50 m ahead of ego → gap at ODD ≈ 19 m at 4.4 m/s closing
      y_m: 1.75
      speed_mps: 6.0     # 22 km/h lead car (was 20.0 m/s — far too fast)
      lane_id: -1
    - actor_id: 2
      rear_follower: true
      distance_behind_ego_m: 30.0
      reaction_delay_s: 1.0
      decel_factor: 1.5
      y_m: 1.75
      lane_id: -1

odd_exit:
  trigger_time_s: 7.0

risk:
  # max_speed_mps: normalises obs[0]=ego_speed. Set to actual max operating speed.
  # At 40 km/h = 11.1 m/s; 15 m/s gives obs[0] ≈ 0.70 at max → well-normalised.
  max_speed_mps: 15.0       # was 30.0 (highway); 15 matches 30-40 km/h regime
  ttc_safe_s: 5.0
  ttc_critical_s: 2.0
  weight_drf: 0.5
  weight_dara: 0.5
  accumulate_risk_phase: "whole_episode"
  k_theta: 0.5
  k_r: 0.05
  max_distance_m: 50.0

baseline:
  # At low speed, DRF ≈ 0 (DRF scale=350 calibrated for highway).
  # risk_total ≈ 0.5 × DARA → max risk ≈ 0.50 when TTC=ttc_critical.
  # Thresholds lowered so all 3 MRMs can be triggered:
  #   risk ≥ 0.40  → STRAIGHT_STOP  (TTC < 2.4 s → emergency)
  #   risk < 0.15  → ROAD_SHOULDER  (TTC > 4.5 s → comfortable to pull over)
  #   else          → IN_LANE_STOP
  risk_brake_threshold: 0.40      # was 0.70 — now achievable at low speed
  min_right_gap_for_pull_over: 15.0
  risk_pull_over_max: 0.15        # was 0.35 — lower = more selective pull-over
  min_rear_gap_for_shoulder_m: 20.0

shield:
  min_right_gap_m: 12.0
  min_rear_gap_m: 30.0

mrm:
  normal_driving:
    # Low throttle keeps ego near 35-40 km/h; 0.4 would accelerate too fast.
    throttle_value: 0.1   # was 0.4; 0.1×2 m/s² accel = +1.4 m/s over 7 s approach
  brake:
    throttle_value: 0.0
    brake_value: 0.769    # in-lane: 77 % of 4.5 m/s² = 3.46 m/s² decel
    steer_value: 0.0
  straight_stop_brake:
    throttle_value: 0.0
    brake_value: 1.0      # full 4.5 m/s² decel — stops 11 m/s in 2.4 s / 13 m
    steer_value: 0.0
  pull_over_right:
    throttle_value: 0.0
    brake_value: 0.7      # 70 % of 4.5 = 3.15 m/s² — stops in 3.5 s / 19 m
    steer_value: -0.9     # heading cap ≈ 20° → lateral shift ≈ 1.5–2 m (shoulder width)

stop_conditions:
  after_odd_exit_stop_speed_mps: 1.3
  stopped_for_s: 2.0
  hard_timeout_s: 30.0    # at 11 m/s stops in ~4 s — 30 s is plenty
  mrc_stop_speed_mps: 0.5

scenario_sampler:
  scenarios:
    - "esmini/bin/resources/xosc/straight_500m.xosc"
  trigger_time_s_variations: [7.0]

# Step 3.5 - PPO training parameters
training:
  algo: "ppo"
  policy: "MlpPolicy"
  total_timesteps: 50000    # quick policy save: 64 episodes = 1 PPO update → policy.zip
  n_steps: 256           # one batch = 64 episodes; must equal total_timesteps here
  batch_size: 64
  n_epochs: 10
  mrm_decision_mode: "one_shot"
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  checkpoint_every_steps: 1000
  verbose: 1
  use_tensorboard: false

ablations:
  use_risk_features: true
  use_risk_penalty_in_reward: true
  use_shield: true

risk_priority:
  sampler_enabled: true
  update_every_episodes: 5
  collision_weight: 2.0
  risk_weight: 1.0
  failure_weight: 1.0
  min_weight: 0.1

reward:
  risk_step_penalty_weight: 0.5
  step_cost: 0.01
  collision_penalty: 100.0
  success_bonus: 10.0
  shoulder_bonus: 5.0
  lane_block_penalty: 2.0

# Short-front-gap scenarios recalibrated for 30-40 km/h.
# Stopping dist (relative, closing=4 m/s, decel=4.5 m/s²): 4²/9 ≈ 1.8 m
# → gap_at_trigger = 4 m still stoppable with 2.2 m clearance.
short_front_gap_coverage:
  mode: "gap_at_trigger"
  gap_at_trigger_min_m: 4.0    # was 25.0 (highway); stoppable at 30-40 km/h
  gap_at_trigger_max_m: 15.0   # was 40.0
  ego_speed_min_mps: 8.0       # was 20.0  (29 km/h)
  ego_speed_max_mps: 11.0      # was 25.0  (40 km/h)
  lead_speed_min_mps: 4.0      # was 10.0  (14 km/h)
  lead_speed_max_mps: 7.0      # was 18.0  (25 km/h)
  min_initial_gap_m: 10.0      # was 30.0
  trigger_time_s_variations: [7.0]
  n_episodes: 10
  distance_behind_ego_min_m: 12.0
  distance_behind_ego_max_m: 48.0
  front_gap_min_m: 5.0         # used by grid/sample only
  front_gap_max_m: 20.0
  speed_min_mps: 8.0           # was 20.0
  speed_max_mps: 11.0          # was 35.0
  front_gap_steps: 4
  speed_steps: 3

# Baseline comparison recalibrated for 30-40 km/h.
baseline_comparison:
  n_episodes: 10
  trigger_time_s: 7.0
  speed_min_mps: 8.0    # was 20.0  (29 km/h)
  speed_max_mps: 11.0   # was 35.0  (40 km/h)
  distance_min_m: 12.0
  distance_max_m: 48.0
  speed_steps: 4
  distance_steps: 4

shoulder_obstacles:
  enabled: true
  probability: 0.3
  right_offset_m: 4.0
  count: 4
  spacing_m: 40.0
  start_ahead_m: 20.0

phase3:
  episode_variation:
    enabled: true
    mix_baseline_probability: 0.5
